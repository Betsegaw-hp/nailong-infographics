
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
#je-root{font-family:'Space Grotesk',sans-serif;background:#0d0f14;color:#ddd;padding:16px 0 20px;min-height:520px}
#je-root h2{font-size:18px;font-weight:600;color:#f0ede6;padding:0 20px 4px;letter-spacing:-.3px}
#je-root .sub{font-size:11px;color:#555;letter-spacing:.08em;text-transform:uppercase;padding:0 20px 14px}
#je-svg{width:100%;display:block}
#detail-panel{margin:0 20px;background:#131720;border:1px solid #1e2535;border-radius:8px;padding:14px 18px;min-height:70px;transition:all .3s}
#detail-panel .dp-name{font-size:14px;font-weight:600;color:#c9a96e;margin-bottom:4px}
#detail-panel .dp-desc{font-size:12px;color:#8a8f9e;line-height:1.6}
#stage-tabs{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}
.stab{font-size:11px;font-family:'Space Grotesk',sans-serif;padding:4px 12px;border:1px solid #2a3040;background:transparent;color:#666;border-radius:3px;cursor:pointer;letter-spacing:.04em;transition:all .2s}
.stab.active,.stab:hover{background:#c9a96e;border-color:#c9a96e;color:#0d0f14}
#flow-bar{display:flex;align-items:center;gap:0;margin:14px 20px 0;border-radius:6px;overflow:hidden}
.fb-seg{flex:1;padding:7px 4px;text-align:center;font-size:10px;letter-spacing:.05em;color:#000;font-weight:600;cursor:pointer;transition:opacity .2s}
.fb-seg:hover{opacity:.85}
#info-foot{font-size:10px;color:#444;padding:10px 20px 0;letter-spacing:.04em}
@keyframes flowAnim{to{stroke-dashoffset:-30}}
.flow-arrow{stroke-dasharray:6 6;animation:flowAnim 1s linear infinite}
</style>
<div id="je-root">
  <h2>Turbofan engine — cutaway</h2>
  <div class="sub">Rolls-Royce Trent 1000 type · Click any section to explore</div>
  <svg id="je-svg" viewBox="0 0 680 270">
    <defs>
      <marker id="farr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <clipPath id="eng-clip"><rect x="28" y="30" width="560" height="210"/></clipPath>
    </defs>

    <!-- Engine outer nacelle -->
    <path d="M28 100 Q28 30 120 30 L540 30 Q600 30 618 135 Q600 240 540 240 L120 240 Q28 240 28 170 Z" fill="#181d28" stroke="#2a3345" stroke-width="1"/>

    <!-- Bypass duct (outer ring) -->
    <path d="M100 52 L530 52 Q580 52 598 135 Q580 218 530 218 L100 218 Q60 218 58 170 L58 100 Q60 52 100 52Z" fill="#0f1320" stroke="#1e2535" stroke-width=".5"/>

    <!-- Core engine tube -->
    <rect x="105" y="98" width="430" height="74" rx="6" fill="#141926" stroke="#252e42" stroke-width=".8"/>

    <!-- ── SECTIONS ── -->
    <!-- 1. Fan (blue) -->
    <g id="sec-fan" class="sec" style="cursor:pointer" onclick="selectSec('fan')">
      <rect x="62" y="55" width="58" height="160" rx="4" fill="#0e1e3a" stroke="#1a3a6a" stroke-width=".8"/>
      <!-- fan blades -->
      <line x1="91" y1="60" x2="91" y2="210" stroke="#1e4a8a" stroke-width="1.5"/>
      <line x1="78" y1="60" x2="78" y2="210" stroke="#1a3f7a" stroke-width="1"/>
      <line x1="104" y1="60" x2="104" y2="210" stroke="#1a3f7a" stroke-width="1"/>
      <line x1="68" y1="72" x2="115" y2="72" stroke="#1e4a8a" stroke-width="1.2"/>
      <line x1="68" y1="88" x2="115" y2="88" stroke="#1a3f7a" stroke-width=".8"/>
      <line x1="68" y1="104" x2="115" y2="104" stroke="#1e4a8a" stroke-width="1.2"/>
      <line x1="68" y1="120" x2="115" y2="120" stroke="#1a3f7a" stroke-width=".8"/>
      <line x1="68" y1="136" x2="115" y2="136" stroke="#1e4a8a" stroke-width="1.2"/>
      <line x1="68" y1="152" x2="115" y2="152" stroke="#1a3f7a" stroke-width=".8"/>
      <line x1="68" y1="168" x2="115" y2="168" stroke="#1e4a8a" stroke-width="1.2"/>
      <line x1="68" y1="184" x2="115" y2="184" stroke="#1a3f7a" stroke-width=".8"/>
      <line x1="68" y1="200" x2="115" y2="200" stroke="#1e4a8a" stroke-width="1.2"/>
      <text font-size="11" fill="#378ADD" font-family="Space Grotesk,sans-serif" font-weight="500" x="91" y="232" text-anchor="middle">Fan</text>
    </g>

    <!-- 2. Low-pressure compressor (LPC) -->
    <g id="sec-lpc" class="sec" style="cursor:pointer" onclick="selectSec('lpc')">
      <rect x="106" y="100" width="72" height="70" rx="3" fill="#101c2e" stroke="#1a3356" stroke-width=".5"/>
      <line x1="120" y1="100" x2="120" y2="170" stroke="#1a4070" stroke-width=".7"/>
      <line x1="134" y1="100" x2="134" y2="170" stroke="#1a4070" stroke-width=".7"/>
      <line x1="148" y1="100" x2="148" y2="170" stroke="#1a4070" stroke-width=".7"/>
      <line x1="162" y1="100" x2="162" y2="170" stroke="#1a4070" stroke-width=".7"/>
      <text font-size="10" fill="#5a9ad4" font-family="Space Grotesk,sans-serif" x="142" y="192" text-anchor="middle">LPC</text>
    </g>

    <!-- 3. High-pressure compressor (HPC) -->
    <g id="sec-hpc" class="sec" style="cursor:pointer" onclick="selectSec('hpc')">
      <rect x="178" y="100" width="90" height="70" rx="3" fill="#0d1826" stroke="#162d4e" stroke-width=".5"/>
      <line x1="192" y1="100" x2="192" y2="170" stroke="#1a3d6a" stroke-width=".6"/>
      <line x1="206" y1="100" x2="206" y2="170" stroke="#1a3d6a" stroke-width=".6"/>
      <line x1="220" y1="100" x2="220" y2="170" stroke="#1a3d6a" stroke-width=".6"/>
      <line x1="234" y1="100" x2="234" y2="170" stroke="#1a3d6a" stroke-width=".6"/>
      <line x1="248" y1="100" x2="248" y2="170" stroke="#1a3d6a" stroke-width=".6"/>
      <line x1="262" y1="100" x2="262" y2="170" stroke="#1a3d6a" stroke-width=".6"/>
      <text font-size="10" fill="#5a9ad4" font-family="Space Grotesk,sans-serif" x="223" y="192" text-anchor="middle">HPC</text>
    </g>

    <!-- 4. Combustion chamber (amber/red — heat) -->
    <g id="sec-comb" class="sec" style="cursor:pointer" onclick="selectSec('comb')">
      <rect x="268" y="98" width="96" height="74" rx="4" fill="#1e1006" stroke="#6b3208" stroke-width=".8"/>
      <!-- flame shapes -->
      <path d="M295 155 Q300 130 305 142 Q310 120 316 155Z" fill="#D85A30" opacity=".8"/>
      <path d="M318 155 Q323 128 328 140 Q333 118 338 155Z" fill="#BA7517" opacity=".8"/>
      <path d="M341 155 Q346 133 350 144 Q354 124 358 155Z" fill="#D85A30" opacity=".7"/>
      <!-- glow -->
      <rect x="268" y="98" width="96" height="74" rx="4" fill="#ff6600" opacity=".04"/>
      <text font-size="10" fill="#EF9F27" font-family="Space Grotesk,sans-serif" x="316" y="192" text-anchor="middle">Combustor</text>
    </g>

    <!-- 5. High-pressure turbine (HPT) -->
    <g id="sec-hpt" class="sec" style="cursor:pointer" onclick="selectSec('hpt')">
      <rect x="364" y="100" width="68" height="70" rx="3" fill="#1a1006" stroke="#5a3010" stroke-width=".5"/>
      <line x1="378" y1="100" x2="378" y2="170" stroke="#8a5020" stroke-width=".7"/>
      <line x1="392" y1="100" x2="392" y2="170" stroke="#8a5020" stroke-width=".7"/>
      <line x1="406" y1="100" x2="406" y2="170" stroke="#8a5020" stroke-width=".7"/>
      <line x1="420" y1="100" x2="420" y2="170" stroke="#8a5020" stroke-width=".7"/>
      <text font-size="10" fill="#EF9F27" font-family="Space Grotesk,sans-serif" x="398" y="192" text-anchor="middle">HPT</text>
    </g>

    <!-- 6. Low-pressure turbine (LPT) -->
    <g id="sec-lpt" class="sec" style="cursor:pointer" onclick="selectSec('lpt')">
      <rect x="432" y="100" width="100" height="70" rx="3" fill="#141006" stroke="#4a2a08" stroke-width=".5"/>
      <line x1="446" y1="100" x2="446" y2="170" stroke="#7a4010" stroke-width=".6"/>
      <line x1="460" y1="100" x2="460" y2="170" stroke="#7a4010" stroke-width=".6"/>
      <line x1="474" y1="100" x2="474" y2="170" stroke="#7a4010" stroke-width=".6"/>
      <line x1="488" y1="100" x2="488" y2="170" stroke="#7a4010" stroke-width=".6"/>
      <line x1="502" y1="100" x2="502" y2="170" stroke="#7a4010" stroke-width=".6"/>
      <line x1="516" y1="100" x2="516" y2="170" stroke="#7a4010" stroke-width=".6"/>
      <text font-size="10" fill="#BA7517" font-family="Space Grotesk,sans-serif" x="482" y="192" text-anchor="middle">LPT</text>
    </g>

    <!-- 7. Nozzle / exhaust -->
    <g id="sec-noz" class="sec" style="cursor:pointer" onclick="selectSec('noz')">
      <path d="M532 100 L598 118 L598 152 L532 170Z" fill="#100a04" stroke="#3a2008" stroke-width=".8"/>
      <text font-size="10" fill="#854F0B" font-family="Space Grotesk,sans-serif" x="570" y="192" text-anchor="middle">Nozzle</text>
    </g>

    <!-- Air intake arrow -->
    <line class="flow-arrow" x1="20" y1="135" x2="58" y2="135" stroke="#378ADD" stroke-width="1.5" marker-end="url(#farr)"/>
    <text font-size="10" fill="#378ADD" font-family="Space Grotesk,sans-serif" x="10" y="128" text-anchor="middle">Air</text>
    <text font-size="10" fill="#378ADD" font-family="Space Grotesk,sans-serif" x="10" y="144" text-anchor="middle">in</text>

    <!-- Bypass flow arrow (top) -->
    <line class="flow-arrow" x1="130" y1="42" x2="530" y2="42" stroke="#185FA5" stroke-width="1" opacity=".6" marker-end="url(#farr)"/>
    <text font-size="9" fill="#185FA5" font-family="Space Grotesk,sans-serif" x="330" y="39" text-anchor="middle" opacity=".7">bypass airflow (80% of thrust)</text>

    <!-- Core flow arrow (bottom, inside core) -->
    <line class="flow-arrow" x1="130" y1="228" x2="530" y2="228" stroke="#185FA5" stroke-width="1" opacity=".6" marker-end="url(#farr)"/>

    <!-- Exhaust arrow -->
    <line class="flow-arrow" x1="602" y1="135" x2="640" y2="135" stroke="#D85A30" stroke-width="1.8" marker-end="url(#farr)"/>
    <text font-size="10" fill="#D85A30" font-family="Space Grotesk,sans-serif" x="650" y="128" text-anchor="middle">Hot</text>
    <text font-size="10" fill="#D85A30" font-family="Space Grotesk,sans-serif" x="650" y="144" text-anchor="middle">gas</text>

    <!-- Section highlight ring (updated by JS) -->
    <rect id="sel-ring" x="62" y="55" width="58" height="160" rx="5" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0" pointer-events="none"/>
  </svg>

  <div id="detail-panel">
    <div class="dp-name" id="dp-name">Select a section</div>
    <div class="dp-desc" id="dp-desc">Click any stage of the engine above to learn what it does and how it works.</div>
  </div>

  <div id="stage-tabs">
    <button class="stab" onclick="selectSec('fan')">Fan</button>
    <button class="stab" onclick="selectSec('lpc')">Low-pressure compressor</button>
    <button class="stab" onclick="selectSec('hpc')">High-pressure compressor</button>
    <button class="stab" onclick="selectSec('comb')">Combustion chamber</button>
    <button class="stab" onclick="selectSec('hpt')">High-pressure turbine</button>
    <button class="stab" onclick="selectSec('lpt')">Low-pressure turbine</button>
    <button class="stab" onclick="selectSec('noz')">Exhaust nozzle</button>
  </div>

  <div id="info-foot">Brayton cycle thermodynamic engine · bypass ratio ~10:1 · thrust 70,000–90,000 lbf</div>
</div>

<script>
const INFO = {
  fan: {
    name: 'Fan',
    x:62,y:55,w:58,h:160,
    desc: 'The massive front fan — up to 3m diameter — ingests huge volumes of air. Around 80% bypasses the core entirely, flowing around the engine to generate most of the thrust quietly and efficiently. Only ~20% enters the core for combustion.'
  },
  lpc: {
    name: 'Low-pressure compressor (LPC)',
    x:106,y:100,w:72,h:70,
    desc: 'Multi-stage axial compressor driven by the low-pressure turbine shaft. Squeezes incoming air to roughly 4× atmospheric pressure using alternating rows of rotating blades and fixed stators, raising temperature and density.'
  },
  hpc: {
    name: 'High-pressure compressor (HPC)',
    x:178,y:100,w:90,h:70,
    desc: 'The HPC continues compression to ~40× atmospheric pressure. Driven by the high-pressure turbine, its titanium and nickel alloy blades spin at up to 12,000 RPM. Air exits at ~500°C — before any combustion has occurred.'
  },
  comb: {
    name: 'Combustion chamber',
    x:268,y:98,w:96,h:74,
    desc: 'Compressed air mixes with atomised jet fuel (Jet-A) and ignites at ~2000°C. The annular combustor burns continuously — the initial spark plug is only needed for startup. Sophisticated cooling holes prevent the surrounding metal from melting.'
  },
  hpt: {
    name: 'High-pressure turbine (HPT)',
    x:364,y:100,w:68,h:70,
    desc: 'Single or dual stage turbine immediately after the combustor. Extracts energy from the white-hot gases to drive the HPC via a concentric shaft. Blades are cast from single-crystal nickel superalloys and cooled internally by air channels.'
  },
  lpt: {
    name: 'Low-pressure turbine (LPT)',
    x:432,y:100,w:100,h:70,
    desc: 'Multiple stages extract remaining energy from the gas flow to drive the fan and LPC. The LPT is the largest turbine section — slower, cooler, and with bigger blades than the HPT. It powers ~80% of the engine\'s total thrust output through the fan.'
  },
  noz: {
    name: 'Exhaust nozzle',
    x:532,y:100,w:66,h:70,
    desc: 'The convergent nozzle accelerates exhaust gases to high velocity, generating thrust by Newton\'s third law. On high-BPR turbofans, the bypass and core flows mix here or are kept separate (unmixed design). Exit temperatures reach 400–600°C.'
  }
};

function selectSec(key) {
  const d = INFO[key];
  document.getElementById('dp-name').textContent = d.name;
  document.getElementById('dp-desc').textContent = d.desc;
  const ring = document.getElementById('sel-ring');
  ring.setAttribute('x', d.x - 3);
  ring.setAttribute('y', d.y - 3);
  ring.setAttribute('width', d.w + 6);
  ring.setAttribute('height', d.h + 6);
  ring.setAttribute('opacity', '1');
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(key) || (key==='comb' && b.textContent.includes('Combustion'))));
}
</script>
